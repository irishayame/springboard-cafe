<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Springboard Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="app">
 <section class="scr on" id="splash">
  <div class="sign"><img src="logo-white.png" alt="Springboard Cafe"></div><p>España’s 24/7 Productivity Cafe</p>
  <div class="seg"><button class="on" data-m="Dine In">Dine In</button><button data-m="Take Out">Take Out</button></div>
  <button class="gold" id="start">Start Ordering</button>
 </section>

 <section class="scr" id="menu">
  <div class="hd"><span><button class="back" data-go="splash">‹</button>Menu</span><b class="mode"></b></div>
  <div class="search"><div>🔍<input id="q" placeholder="Search drinks and food"></div></div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
 </section>

 <section class="scr" id="chat">
  <div class="hd"><span><button class="back" data-go="menu">‹</button>Ask Brew</span><b class="mode"></b></div>
  <div id="msgs"></div>
  <div class="quick"><button>Something sweet</button><button>Strong coffee</button><button>No caffeine</button><button>Something filling</button></div>
  <form class="inp" id="cf" onsubmit="return false"><input id="ci" placeholder="Type a message..." autocomplete="off"><button class="gold" id="send">Send</button></form>
 </section>

 <section class="scr" id="order">
  <div class="hd"><span><button class="back" data-go="menu">‹</button>Your Order</span><b class="mode"></b></div>
  <div class="pad" id="ob"></div>
 </section>

 <section class="scr" id="status">
  <div class="hd"><span>Order Status</span></div>
  <div class="pad" id="sb"></div>
 </section>

 <nav class="nav" id="nav">
  <button data-go="splash"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></button>
  <button data-go="menu"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.500V19c3-.5 6 0 8 1.500 2-1.500 5-2 8-1.500V4.500C17 4 14 4.500 12 6zM12 6v14M6 9h3M6 12h3M15 9h3M15 12h3"/></svg></button>
  <button data-go="chat"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/></svg></button>
  <button data-go="order"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.500"/><path d="M6.500 9.500v.01M17.500 14.500v.01"/></svg></button>
 </nav>

 <div id="sheet"><div id="sh"></div></div>
 <div id="toast"></div>
</div>
<script src="app.js"></script></body></html>
